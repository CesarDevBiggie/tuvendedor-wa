# =========================================================
# TUVENDEDOR WHATSAPP
# Principal + Multicanal + Panambi Social
# =========================================================
#
# IMPORTANTE:
# - Mantener .env.production existente.
# - No modificar ni eliminar los volumenes de autenticacion.
# - No ejecutar docker compose down -v.
# =========================================================

services:
  # =========================================================
  # WHATSAPP PRINCIPAL - PANAMBI SOCIAL
  # =========================================================
  tuvendedor_wa:
    build:
      context: .
      dockerfile: Dockerfile

    image: tuvendedor-wa:unificado-20261017
    container_name: tuvendedor_wa

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      WA_DISABLE_ERROR_FALLBACK: "true"

      # =======================================================
      # PANAMBI SOCIAL
      # =======================================================
      PANAMBI_SOCIAL_ENABLED: "true"

      # Habilita los nuevos comandos de Meta en WhatsApp
      PANAMBI_META_COMMAND_ENABLED: "true"

    volumes:
      # Sesion principal de WhatsApp
      - /srv/tuvendedor/whatsapp/auth:/app/.wwebjs_auth

      # Cache de WhatsApp
      - /srv/tuvendedor/whatsapp/cache:/app/.wwebjs_cache

      # Flyers originales y borradores persistentes
      - /srv/tuvendedor/whatsapp/panambi-social-media:/app/panambi-social-media

    ports:
      - "127.0.0.1:3100:3100"

    networks:
      - ecommerce_network

    restart: unless-stopped
    init: true
    shm_size: "512mb"

  # =========================================================
  # WHATSAPP MANAGER - MULTICANAL
  # =========================================================
  tuvendedor_wa_manager:
    image: tuvendedor-wa:unificado-20261017
    container_name: tuvendedor_wa_manager

    command: ["node", "manager.js"]

    depends_on:
      - tuvendedor_wa

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      WA_MANAGER_PORT: "3200"
      WA_MANAGER_STATE_DIR: /var/lib/tuvendedor-wa-manager
      WA_LEGACY_BRIDGE_URL: http://tuvendedor_wa:3100
      TUVENDEDOR_API_URL: http://market_backend

    volumes:
      # Independiente de las credenciales del principal
      - /srv/tuvendedor/whatsapp/manager:/var/lib/tuvendedor-wa-manager

    networks:
      - ecommerce_network

    restart: unless-stopped
    init: true
    shm_size: "1gb"

    # Sin puertos publicos.
    # Accesible solamente desde la red Docker.

# =========================================================
# REDES
# =========================================================
networks:
  ecommerce_network:
    external: true
    name: ecommerce_network
