services:
  tuvendedor_wa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tuvendedor_wa

    env_file:
      - .env

    environment:
      # Dentro de Docker NO usamos localhost para llegar al backend.
      TUVENDEDOR_API_URL: http://market_backend
      WA_HEADLESS: "true"
      WA_EXECUTABLE_PATH: /usr/bin/chromium

    # Persistencia REAL fuera del contenedor.
    # Si el contenedor se elimina, la sesión de WhatsApp permanece en el VPS.
    volumes:
      - /srv/tuvendedor/whatsapp/auth:/app/.wwebjs_auth
      - /srv/tuvendedor/whatsapp/cache:/app/.wwebjs_cache

    # Solo accesible desde el propio VPS para diagnóstico.
    ports:
      - "127.0.0.1:3100:3100"

    networks:
      - ecommerce_network

    restart: unless-stopped
    init: true
    shm_size: "512mb"

networks:
  ecommerce_network:
    external: true
    name: ecommerce_network
